name: Defence Science & Technology Laboratories (Dstl)

description: 'Defence Science & Technology Laboratories (Dstl) is the UK government’s dedicated research and development organisation for defence and security. It delivers scientific and technological innovation to support national security, works with industry and academia, and publishes research, data and APIs across a range of domains including cyber, AI, and advanced materials.'

